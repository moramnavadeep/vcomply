# Render blueprint: one web service for the API and one Postgres database.
# Render dashboard -> New -> Blueprint -> pick this repository -> Apply.
services:
  - type: web
    name: niyam-api
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: JWT_SECRET
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: https://moramnavadeep.github.io
      - key: DATABASE_URL
        fromDatabase:
          name: niyam-db
          property: connectionString

databases:
  - name: niyam-db
    plan: free
